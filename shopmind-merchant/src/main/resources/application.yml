server:
  port: 9101

spring:
  application:
    name: shopmind-merchant
  datasource:
    url: jdbc:mysql://localhost:3307/shopmind_merchant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: shopmind
    password: ${DB_PASSWORD:shopmind123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3s
  ai:
    openai:
      # 支持 DeepSeek / 通义千问 / 硅基流动 / OpenAI 等任意兼容端点
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:sk-fake-key-for-test}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
